<!DOCTYPE html>
<html>
{% include head.html %}
<body>
<div>
<header class="header-background">
<div class="clearfix border-bottom-thick header-border">
<ul class="list-reset right py-1 header-text font-smoothing">
{% for my_page in site.pages %}
{% if my_page.title %}
<li class="inline-block">
<a class="align-middle link-primary header-link mr-2" href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a>
</li>
{% endif %}
{% endfor %}
</ul>
</div>
<div class="container mx-auto px-2 mb-2 clearfix header-text">
<h1 class="h0 inline-block col-12 sm-width-full py-4 mt-3 header-title" style="word-break: keep-all; overflow-wrap: normal;">{{ page.title | default: site.title }}</h1>
<div class="clearfix mb-4 py-1">
<p class="h4 lh-condensed font-smoothing mt-2 py-1">{{ page.description | default: site.description }}</p>
</div>
</div>
</div>
</header>
<div class="container mx-auto px-2 py-4">
{{ content }}
</div>
</div>
{% include footer.html %}
</body>
</html>
